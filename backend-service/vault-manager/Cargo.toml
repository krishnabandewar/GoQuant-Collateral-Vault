[package]
name = "vault-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "sync"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
# solana-client = "1.18"
# solana-sdk = "1.18"
dotenv = "0.15"
env_logger = "0.10"
log = "0.4"
actix = "0.13"
actix-web-actors = "4"
